# CONFIGURATION FILE FOR cycle_optimizer.py - power_curves.py 
# Reported values correspond to the current state of kitepower system June 2025

# Kite mass, area, and aerodynamic properties
kite:
  mass: 36.2                 # kg
  projected_area: 19.75         # m2
  drag_coefficient:
    powered: 0.175
    depowered: 0.145 #67587475026779
  lift_coefficient:
    powered: 0.6823802656058869
    depowered: 0.44806543118525693
    

# Powered state:
# 0.6823802656058869
# 0.1377398042029228
# 0.2022398042029228
# Depowered state:
# 0.44806543118525693
# 0.10758747502677903
# 0.172087475026779

# Mean CL powered: 0.64
# Mean CD powered: 0.12
# Mean CL/CD powered: 5.13
# Std CL powered: 0.07
# Std CD powered: 0.03
# Mean CL depowered: 0.41
# Mean CD depowered: 0.11
    
# Tether properties
tether:
  length: 307                   # m
  diameter: 0.01               # m
  density: 970    # kg/m3
  drag_coefficient: 1.1         # -

# Environment 
environment:
  profile: logarithmic
  roughness_length: 0.1
  ref_height: 100
  ref_windspeeds: [7.5, 7.75,
                    8.0, 8.25, 8.5, 8.75, 9.0, 9.25, 9.5, 9.75,
                    10.0, 10.25, 10.5, 10.75, 11.0, 11.25, 11.5, 11.75,
                    12.0, 12.25, 12.5, 12.75, 13.0, 13.25, 13.5, 13.75,
                    14.0, 14.25, 14.5, 14.75, 15.0, 15.25, 15.5, 15.75,
                    16.0]

sim_settings:
  force_or_speed_control: 'hybrid'
  time_step_RO: 0.1
  time_step_RI: 0.1
  time_step_RIRO: 0.1

# Bounds to the optimisation
bounds:
  avg_elevation: # Average elevation angle during reel out
    min: 30.                    # deg
    max: 60.                    # deg
  max_azimuth:  # Maximum azimuth angle during reel out (max flight cone width)
    min: 15.                    # deg
    max: 40.                    # deg
  relative_elevation: # Maximum elevation relative to the average elevation (max flight cone height)
    min: 5.                      # deg
    max: 10.                     # deg 
  force_limits: # Minimum force to have control on the kite 
    min: 90                    # kgf
    max: 9000                  # kgf
  speed_limits: # Should be both positive, so the full range is [-max, -min] U [min, max]
    min: 0.0                    # m/s
    max: 9.8                    # m/s
  tether_stroke:
    min: 100                     # m
    max: 150                    # m
  minimum_tether_length: # Tether length at start of reel-out
    min: 180                    # m
    max: 200                    # m

constraints:
  # Default constraints
  force_out_setpoint_min: 
    enabled: true
  force_in_setpoint_max:
    enabled: true
  ineq_cons_traction_max_force:
    enabled: true
  ineq_cons_min_tether_length:
    enabled: true
  ineq_cons_max_tether_length :
    enabled: true

  # Parametric constraints
  ineq_cons_cw_patterns:
    enabled: true
    min_patterns: 1 # Minimum number of crosswind patterns [-]
  ineq_cons_max_elevation:  
    enabled: true
    max_elevation: 100 # Maximum elevation angle [deg]
  ineq_cons_max_course_rate:
    enabled: true
    max_course_rate: 1.23 # Maximum course rate [rad/s]
  ineq_cons_min_height:
    enabled: true
    min_height: 20
 
opt_variables:
  v_RO:
    enabled: true
    init_value: 1.33
  F_RI:
   enabled: true
   init_value: 882.540000 # N  
  
  average_elevation:
    enabled: true
    init_value: 35.46 # deg
  relative_elevation:
    enabled: true
    init_value: 4.2847 # deg
  maximum_azimuth:    
    enabled: true
    init_value: 18.86455662 # deg
  minimum_tether_length:
    enabled: false
    init_value: 201.516 # m
  tether_stroke:
    enabled: false 
    init_value: 103.9 # m

opt_settings:
  maxiter: 30
  iprint: 2 
  ftol: 1e-6
  eps: 1e-6

